name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Read-only tools over the synthetic example
        run: |
          python3 -m arcturion_memory health --config examples/config.example.json
          python3 -m arcturion_memory audit  --config examples/config.example.json
          python3 -m arcturion_memory dedup  --config examples/config.example.json --embedder lexical --min-chars 100
          python3 -m arcturion_memory recall "test suite" --config examples/config.example.json
